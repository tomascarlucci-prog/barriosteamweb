name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Te permite hacerlo correr a mano cuando quieras para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request to Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/alumnos?select=count" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
